<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão Financeira</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f8f7f4;--surface:#ffffff;--surface2:#f1f0ec;--border:#e2e1dc;--border2:#d0cfc9;
    --text:#1a1a18;--text2:#6b6a65;--text3:#9e9d98;
    --green:#1D9E75;--green-bg:#e1f5ee;--green-text:#085041;
    --red:#D85A30;--red-bg:#faece7;--red-text:#712B13;
    --blue:#185FA5;--blue-bg:#e6f1fb;--blue-text:#0C447C;
    --amber:#BA7517;--amber-bg:#faeeda;--amber-text:#633806;
    --radius:8px;--radius-lg:12px;
  }
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
  .page{display:none;padding:1.5rem;max-width:860px;margin:0 auto}.page.active{display:block}
  .home-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
  .home-logo{font-size:28px;font-weight:600;margin-bottom:6px;letter-spacing:-0.5px}
  .home-sub{color:var(--text2);margin-bottom:3rem;font-size:15px}
  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;width:100%;max-width:500px}
  .home-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2rem 1.5rem;cursor:pointer;transition:border-color .15s,transform .1s,box-shadow .15s;text-align:center}
  .home-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.06)}
  .home-card .icon{font-size:32px;margin-bottom:1rem}
  .home-card .label{font-size:17px;font-weight:600;margin-bottom:5px}
  .home-card .desc{font-size:12px;color:var(--text2);line-height:1.5}
  .nav{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
  .nav-title{font-size:18px;font-weight:600;flex:1}
  .nav-back{cursor:pointer;font-size:13px;color:var(--text2);display:flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
  .nav-back:hover{background:var(--surface2)}
  .btn{padding:7px 14px;border:1px solid var(--border2);border-radius:var(--radius);cursor:pointer;font-size:13px;font-family:inherit;background:var(--surface);color:var(--text);display:inline-flex;align-items:center;gap:6px;transition:background .12s}
  .btn:hover{background:var(--surface2)}
  .btn-primary{background:var(--text);color:#fff;border-color:var(--text)}.btn-primary:hover{opacity:.85}
  .btn-success{background:var(--green-bg);color:var(--green-text);border-color:rgba(29,158,117,.3)}.btn-success:hover{opacity:.85}
  .btn-danger{background:var(--red-bg);color:var(--red-text);border-color:rgba(216,90,48,.3)}.btn-danger:hover{opacity:.85}
  .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1.5rem}
  .stat-card{background:var(--surface2);border-radius:var(--radius);padding:14px}
  .stat-label{font-size:11px;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
  .stat-val{font-size:20px;font-weight:600}
  .tabs{display:flex;gap:2px;margin-bottom:1.5rem;background:var(--surface2);padding:3px;border-radius:var(--radius);width:fit-content}
  .tab{padding:6px 14px;font-size:13px;border-radius:6px;cursor:pointer;color:var(--text2);transition:all .12s;white-space:nowrap;font-family:inherit;border:none;background:none}
  .tab.active{background:var(--surface);color:var(--text);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .toolbar{display:flex;gap:8px;margin-bottom:1rem;align-items:center}
  .search-input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;font-family:inherit;background:var(--surface);color:var(--text)}
  .search-input:focus{outline:none;border-color:var(--blue)}
  .card-list{display:flex;flex-direction:column;gap:10px}
  .item-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem;cursor:pointer;transition:border-color .12s}
  .item-card:hover{border-color:var(--border2)}.item-card.no-click{cursor:default}
  .item-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
  .item-name{font-size:15px;font-weight:600}
  .item-sub{font-size:12px;color:var(--text2);margin-top:2px}
  .item-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
  .meta-item{font-size:12px;color:var(--text2)}.meta-item strong{display:block;font-size:13px;color:var(--text);font-weight:500;margin-top:1px}
  .badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500;white-space:nowrap}
  .badge-ativo{background:var(--green-bg);color:var(--green-text)}
  .badge-quitado{background:var(--surface2);color:var(--text2)}
  .badge-pendente{background:var(--amber-bg);color:var(--amber-text)}
  .badge-pago{background:var(--green-bg);color:var(--green-text)}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem}
  .modal-overlay.hidden{display:none}
  .modal{background:var(--surface);border-radius:var(--radius-lg);padding:1.5rem;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
  .modal h2{font-size:17px;font-weight:600;margin-bottom:1.25rem}
  .field{margin-bottom:1rem}.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:500}
  .field input,.field select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;font-family:inherit;background:var(--surface);color:var(--text)}
  .field input:focus,.field select:focus{outline:none;border-color:var(--blue)}
  .modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--border)}
  .detail-section{background:var(--surface2);border-radius:var(--radius);padding:1rem;margin-bottom:1rem}
  .detail-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid var(--border)}
  .detail-row:last-child{border-bottom:none}.detail-row span:first-child{color:var(--text2)}.detail-row span:last-child{font-weight:500}
  .hist-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:13px;border-bottom:1px solid var(--border)}
  .hist-item:last-child{border-bottom:none}.hist-sub{color:var(--text2);font-size:12px;margin-top:2px}.tpos{color:var(--green-text);font-weight:600}
  .month-group{margin-bottom:1.5rem}
  .month-header{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.5px}
  .empty{text-align:center;padding:3rem 1rem;color:var(--text3);font-size:14px}.empty-icon{font-size:36px;margin-bottom:10px}
  .section-title{font-size:15px;font-weight:600;margin-bottom:1rem}
  /* Loading overlay */
  #loading-overlay{position:fixed;inset:0;background:rgba(248,247,244,.9);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
  #loading-overlay.hidden{display:none}
  .spinner{width:32px;height:32px;border:3px solid var(--border2);border-top-color:var(--text);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{font-size:13px;color:var(--text2)}
  @media(max-width:500px){.home-grid{grid-template-columns:1fr}.sim-grid{grid-template-columns:1fr}.stats-row{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading-overlay" class="hidden">
  <div class="spinner"></div>
  <div class="loading-text">Carregando dados...</div>
</div>

<!-- HOME -->
<div id="p-home" class="page active">
  <div class="home-wrap">
    <div class="home-logo">💼 Gestão Financeira</div>
    <div class="home-sub">Selecione o módulo que deseja acessar</div>
    <div class="home-grid">
      <div class="home-card" onclick="goTo('emprestimos')">
        <div class="icon">💰</div><div class="label">Empréstimos</div>
        <div class="desc">Controle saldos, mensalidades e atrasos</div>
      </div>
      <div class="home-card" onclick="goTo('alugueis')">
        <div class="icon">🏠</div><div class="label">Aluguéis</div>
        <div class="desc">Gerencie imóveis, inquilinos e mensalidades</div>
      </div>
    </div>
  </div>
</div>

<!-- EMPRÉSTIMOS -->
<div id="p-emprestimos" class="page">
  <div class="nav">
    <button class="nav-back" onclick="goTo('home')">← Início</button>
    <span class="nav-title">Empréstimos</span>
    <button class="btn btn-primary" onclick="openModal('emp')">+ Novo empréstimo</button>
  </div>
  <div class="stats-row" id="emp-stats"></div>
  <div class="tabs">
    <button class="tab active" onclick="empTab('ativos',this)">Ativos</button>
    <button class="tab" onclick="empTab('todos',this)">Todos</button>
    <button class="tab" onclick="empTab('quitados',this)">Quitados</button>
  </div>
  <div class="toolbar" id="emp-toolbar">
    <input class="search-input" type="text" id="emp-search" placeholder="Buscar por identificação..." oninput="renderEmp()">
  </div>
  <div id="emp-list" class="card-list"></div>
</div>

<!-- DETALHE EMPRÉSTIMO -->
<div id="p-emp-detail" class="page">
  <div class="nav">
    <button class="nav-back" onclick="goTo('emprestimos')">← Voltar</button>
    <span class="nav-title" id="detail-name">Detalhes</span>
  </div>
  <div id="emp-detail-body"></div>
</div>

<!-- ALUGUÉIS -->
<div id="p-alugueis" class="page">
  <div class="nav">
    <button class="nav-back" onclick="goTo('home')">← Início</button>
    <span class="nav-title">Aluguéis</span>
    <button class="btn btn-primary" onclick="openModal('imov')">+ Novo imóvel</button>
  </div>
  <div class="stats-row" id="alug-stats"></div>
  <div class="tabs">
    <button class="tab active" onclick="alugTab('imoveis',this)">Imóveis</button>
    <button class="tab" onclick="alugTab('pagamentos',this)">Pagamentos do mês</button>
    <button class="tab" onclick="alugTab('historico',this)">Histórico</button>
  </div>
  <div id="alug-body"></div>
</div>

<!-- DETALHE IMÓVEL -->
<div id="p-imov-detail" class="page">
  <div class="nav">
    <button class="nav-back" onclick="goTo('alugueis')">← Aluguéis</button>
    <span class="nav-title" id="imov-detail-name">Imóvel</span>
    <button class="btn btn-danger" id="imov-detail-del-btn">🗑 Excluir</button>
  </div>
  <div id="imov-detail-body"></div>
</div>

<!-- MODAL NOVO EMPRÉSTIMO (ATUALIZADO) -->
<div id="modal-emp" class="modal-overlay hidden">
  <div class="modal">
    <h2>Novo empréstimo</h2>
    <div class="field"><label>Identificação (Nome - Responsável) *</label><input id="e-ident" type="text" placeholder="Ex: SORVETE - IRMAO SORVETE"></div>
    <div class="field"><label>Telefone</label><input id="e-tel" type="text" placeholder="Ex: 77999757627"></div>
    <div class="field"><label>Capital / Valor emprestado (R$) *</label><input id="e-capital" type="number" min="0" step="0.01"></div>
    <div class="field"><label>Dia de Cobrança (1 a 31) *</label><input id="e-dia" type="number" min="1" max="31"></div>
    <div class="field"><label>Valor da Cobrança Mensal / Parcela (R$) *</label><input id="e-valor-cob" type="number" min="0" step="0.01"></div>
    <div class="field"><label>Modalidade</label>
      <select id="e-mod">
        <option value="JUROS_SIMPLES">Juros Simples Contínuo</option>
        <option value="PARCELADO">Parcelado (Valor Fixo)</option>
      </select>
    </div>
    <div class="field"><label>Meses em atraso (Opcional)</label><input id="e-atraso" type="text" placeholder="Ex: 03, 04, 05"></div>
    <div class="field"><label>Pagamento Parcial (R$ - Opcional)</label><input id="e-pag-parcial" type="number" min="0" step="0.01" value="0"></div>
    <div class="field"><label>Saldo Devedor Acumulado (R$ - Opcional)</label><input id="e-saldo" type="number" min="0" step="0.01" value="0"></div>
    
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('emp')">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarEmp()">Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL IMÓVEL -->
<div id="modal-imov" class="modal-overlay hidden">
  <div class="modal">
    <h2>Cadastrar imóvel</h2>
    <div class="field"><label>Endereço / identificação *</label><input id="i-end" type="text" placeholder="Ex: Rua das Flores, 123"></div>
    <div class="field"><label>Nome do inquilino *</label><input id="i-inq" type="text" placeholder="Ex: Maria Souza"></div>
    <div class="field"><label>Valor do aluguel (R$) *</label><input id="i-valor" type="number" min="0" step="0.01"></div>
    <div class="field"><label>Dia de vencimento *</label><input id="i-dia" type="number" min="1" max="31" placeholder="Ex: 10"></div>
    <div class="field"><label>Início do contrato *</label><input id="i-inicio" type="date"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('imov')">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarImov()">Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL BAIXA ALUGUEL -->
<div id="modal-alug-pag" class="modal-overlay hidden">
  <div class="modal">
    <h2>Confirmar pagamento</h2>
    <p id="ap-desc" style="font-size:13px;color:var(--text2);margin-bottom:1rem;padding:10px;background:var(--surface2);border-radius:var(--radius)"></p>
    <div class="field"><label>Data do pagamento *</label><input id="ap-data" type="date"></div>
    <div class="field">
      <label>Valor recebido (R$) *</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input id="ap-valor" type="number" min="0" step="0.01" style="flex:1">
        <button class="btn btn-success" onclick="preencherValorTotal()" style="white-space:nowrap;flex-shrink:0">✓ Valor total</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('alug-pag')">Cancelar</button>
      <button class="btn btn-primary" onclick="confirmarAlugPag()">Confirmar</button>
    </div>
  </div>
</div>

<script>
// ─── SUPABASE CONFIG ───
const SUPA_URL = 'https://njxmkbottjywjggolott.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qeG1rYm90dGp5d2pnZ29sb3R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNTA4MzksImV4cCI6MjA5NDcyNjgzOX0.3OmlrwwnY37a5VuhGU9P_xn6Anw-MGuB8jhsXwq0S6M';

async function sbFetch(path, opts = {}) {
  const res = await fetch(SUPA_URL + '/rest/v1/' + path, {
    headers: {
      'apikey': SUPA_KEY,
      'Authorization': 'Bearer ' + SUPA_KEY,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || 'return=representation',
      ...opts.headers
    },
    ...opts
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(err);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : [];
}

async function sbGet(table) { return sbFetch(table + '?select=*'); }
async function sbInsert(table, data) { return sbFetch(table, { method: 'POST', body: JSON.stringify(data) }); }
async function sbUpdate(table, id, data) { return sbFetch(table + '?id=eq.' + id, { method: 'PATCH', body: JSON.stringify(data) }); }
async function sbDelete(table, id) { return sbFetch(table + '?id=eq.' + id, { method: 'DELETE', prefer: 'return=minimal' }); }
async function sbDeleteWhere(table, col, val) { return sbFetch(table + '?' + col + '=eq.' + val, { method: 'DELETE', prefer: 'return=minimal' }); }

// ─── STATE ───
let DB = { emprestimos: [], imoveis: [], alugPags: [] };
let currentEmpId = null, currentAlugPagCtx = null, currentImovId = null;
let empFilter = 'ativos', alugFilter = 'imoveis';
let alugMesFiltro = today();

function today() { return new Date().toISOString().split('T')[0]; }
function fmt(v) { return 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtDate(d) { if (!d) return '—'; const p = d.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function loading(show) { document.getElementById('loading-overlay').classList.toggle('hidden', !show); }

async function loadAll() {
  loading(true);
  try {
    const [emps, imovs, pags] = await Promise.all([sbGet('emprestimos'), sbGet('imoveis'), sbGet('alug_pags')]);
    DB.emprestimos = emps; // Atualizado para o novo formato
    DB.imoveis = imovs.map(i => ({ ...i, end: i.endereco }));
    DB.alugPags = pags.map(p => ({ ...p, imovelId: p.imovel_id, data: p.data_pag }));
  } catch(e) { alert('Erro ao carregar dados: ' + e.message); }
  loading(false);
}

function goTo(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('p-' + page).classList.add('active');
  window.scrollTo(0, 0);
  if (page === 'emprestimos') { renderEmpStats(); renderEmp(); }
  if (page === 'alugueis') { renderAlugStats(); renderAlug(); }
  if (page === 'emp-detail' && currentEmpId) renderEmpDetail();
  if (page === 'imov-detail' && currentImovId) renderImovDetail();
}

function openModal(id) {
  document.getElementById('modal-' + id).classList.remove('hidden');
}
function closeModal(id) { document.getElementById('modal-' + id).classList.add('hidden'); }

// ─── EMPRÉSTIMOS (LÓGICA ATUALIZADA) ───
async function salvarEmp() {
  const identificacao = document.getElementById('e-ident').value.trim();
  const telefone = document.getElementById('e-tel').value.trim();
  const capital = document.getElementById('e-capital').value;
  const dia_cobranca = document.getElementById('e-dia').value;
  const valor_cobranca = document.getElementById('e-valor-cob').value;
  const modalidade = document.getElementById('e-mod').value;
  const meses_em_atraso = document.getElementById('e-atraso').value.trim();
  const pagamento_parcial = document.getElementById('e-pag-parcial').value || 0;
  const saldo_devedor_juros = document.getElementById('e-saldo').value || 0;

  if (!identificacao || !capital || !dia_cobranca || !valor_cobranca) { 
    alert('Preencha os campos obrigatórios (*).'); 
    return; 
  }
  loading(true);
  try {
    const rec = { 
      identificacao, 
      telefone,
      capital: Number(capital), 
      dia_cobranca: Number(dia_cobranca),
      valor_cobranca: Number(valor_cobranca),
      modalidade,
      meses_em_atraso,
      pagamento_parcial: Number(pagamento_parcial),
      saldo_devedor_juros: Number(saldo_devedor_juros),
      quitado: false 
    };
    
    // O Supabase irá devolver o registro completo, incluindo o novo UUID gerado
    const response = await sbInsert('emprestimos', rec);
    
    if(response && response.length > 0) {
      DB.emprestimos.push(response[0]);
    } else {
      DB.emprestimos.push(rec); // fallback local
    }
    
    closeModal('emp');
    ['e-ident','e-tel','e-capital','e-dia','e-valor-cob','e-atraso','e-pag-parcial','e-saldo'].forEach(i => document.getElementById(i).value = '');
    document.getElementById('e-mod').value = 'JUROS_SIMPLES';
    
    renderEmpStats(); renderEmp();
  } catch(e) { alert('Erro ao salvar: ' + e.message); }
  loading(false);
}

function empTab(f, el) {
  empFilter = f;
  document.querySelectorAll('#p-emprestimos .tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderEmp();
}

function renderEmpStats() {
  const ativos = DB.emprestimos.filter(e => !e.quitado);
  const total = ativos.length;
  const captado = DB.emprestimos.reduce((s, e) => s + Number(e.capital), 0);
  const receber = ativos.reduce((s, e) => s + Number(e.saldo_devedor_juros), 0);
  document.getElementById('emp-stats').innerHTML = `
    <div class="stat-card"><div class="stat-label">Ativos</div><div class="stat-val">${total}</div></div>
    <div class="stat-card"><div class="stat-label">Capital Emprestado</div><div class="stat-val">${fmt(captado)}</div></div>
    <div class="stat-card"><div class="stat-label">Saldo Acumulado (Atraso)</div><div class="stat-val" style="color:var(--red)">${fmt(receber)}</div></div>`;
}

function renderEmp() {
  const q = (document.getElementById('emp-search').value || '').toLowerCase();
  let list = DB.emprestimos.filter(e => (e.identificacao || '').toLowerCase().includes(q));
  if (empFilter === 'ativos') list = list.filter(e => !e.quitado);
  if (empFilter === 'quitados') list = list.filter(e => e.quitado);
  
  // Ordena pelo dia de cobrança
  list = list.slice().sort((a, b) => a.dia_cobranca - b.dia_cobranca);
  
  const el = document.getElementById('emp-list');
  if (!list.length) { el.innerHTML = '<div class="empty"><div class="empty-icon">💸</div>Nenhum empréstimo encontrado</div>'; return; }
  el.innerHTML = list.map(e => {
    return `<div class="item-card" onclick="openDetail('${e.id}')">
      <div class="item-header">
        <div><div class="item-name">${e.identificacao}</div><div class="item-sub">Dia de cobrança: ${e.dia_cobranca} · ${e.modalidade.replace('_', ' ')}</div></div>
        <span class="badge badge-${e.quitado ? 'quitado' : 'ativo'}">${e.quitado ? 'Quitado' : 'Ativo'}</span>
      </div>
      <div class="item-meta">
        <div class="meta-item">Capital<strong>${fmt(e.capital)}</strong></div>
        <div class="meta-item">Cobrança Mensal<strong>${fmt(e.valor_cobranca)}</strong></div>
        <div class="meta-item" style="color:var(--red)">Saldo Devedor<strong>${fmt(e.saldo_devedor_juros)}</strong></div>
      </div>
    </div>`;
  }).join('');
}

function openDetail(id) {
  currentEmpId = id;
  const emp = DB.emprestimos.find(x => x.id === id);
  document.getElementById('detail-name').textContent = emp ? emp.identificacao : 'Detalhes';
  goTo('emp-detail');
}

function renderEmpDetail() {
  const e = DB.emprestimos.find(x => x.id === currentEmpId);
  if (!e) return;
  
  document.getElementById('emp-detail-body').innerHTML = `
    <div class="stats-row">
      <div class="stat-card"><div class="stat-label">Capital</div><div class="stat-val">${fmt(e.capital)}</div></div>
      <div class="stat-card"><div class="stat-label">Mensalidade</div><div class="stat-val">${fmt(e.valor_cobranca)}</div></div>
      <div class="stat-card"><div class="stat-label">Saldo Acumulado</div><div class="stat-val" style="color:var(--red)">${fmt(e.saldo_devedor_juros)}</div></div>
    </div>
    <div class="detail-section">
      <div class="detail-row"><span>Devedor / Responsável</span><span>${e.identificacao}</span></div>
      <div class="detail-row"><span>Telefone</span><span>${e.telefone || '—'}</span></div>
      <div class="detail-row"><span>Dia de Cobrança</span><span>${e.dia_cobranca}</span></div>
      <div class="detail-row"><span>Modalidade</span><span>${e.modalidade.replace('_', ' ')}</span></div>
      <div class="detail-row"><span>Meses em Atraso</span><span style="color:var(--red)">${e.meses_em_atraso || 'Nenhum'}</span></div>
      <div class="detail-row"><span>Pagamento Parcial Acumulado</span><span style="color:var(--green)">${fmt(e.pagamento_parcial)}</span></div>
      <div class="detail-row"><span>Status</span><span>${e.quitado ? '✅ Quitado' : '🟡 Em aberto'}</span></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:1.25rem;flex-wrap:wrap">
      ${!e.quitado ? `<button class="btn" onclick="quitarEmp('${e.id}')">✓ Marcar como quitado</button>` : ''}
      <button class="btn btn-danger" onclick="excluirEmp('${e.id}')">🗑 Excluir empréstimo</button>
    </div>`;
}

async function quitarEmp(id) {
  if (!confirm('Marcar como quitado?')) return;
  loading(true);
  try {
    await sbUpdate('emprestimos', id, { quitado: true });
    DB.emprestimos.find(x => x.id === id).quitado = true;
    renderEmpDetail(); renderEmpStats();
  } catch(e) { alert('Erro: ' + e.message); }
  loading(false);
}

async function excluirEmp(id) {
  if (!confirm('Excluir este empréstimo permanentemente?')) return;
  loading(true);
  try {
    await sbDelete('emprestimos', id);
    DB.emprestimos = DB.emprestimos.filter(x => x.id !== id);
    goTo('emprestimos');
  } catch(e) { alert('Erro: ' + e.message); }
  loading(false);
}

// ─── ALUGUÉIS ───
function renderAlugStats() {
  const ativos = DB.imoveis.filter(i => i.ativo!==false).length;
  const mensal = DB.imoveis.filter(i => i.ativo!==false).reduce((s,i) => s+Number(i.valor), 0);
  const mes = today().slice(0,7);
  const pgMes = DB.alugPags.filter(p => p.mes===mes && p.pago).length;
  document.getElementById('alug-stats').innerHTML = `
    <div class="stat-card"><div class="stat-label">Imóveis ativos</div><div class="stat-val">${ativos}</div></div>
    <div class="stat-card"><div class="stat-label">Receita mensal</div><div class="stat-val">${fmt(mensal)}</div></div>
    <div class="stat-card"><div class="stat-label">Pagos este mês</div><div class="stat-val">${pgMes}/${ativos}</div></div>`;
}

function alugTab(f, el) {
  alugFilter = f;
  document.querySelectorAll('#p-alugueis .tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active'); renderAlug();
}

function renderAlug() {
  const el = document.getElementById('alug-body');
  if (alugFilter==='imoveis') renderImoveis(el);
  else if (alugFilter==='pagamentos') renderPagMes(el);
  else renderHistAlug(el);
}

function getPendentesImov(imov) {
  const inicio = imov.inicio.slice(0,7), atual = today().slice(0,7);
  const pendentes = []; let cursor = inicio;
  while (cursor <= atual) {
    const pago = DB.alugPags.find(p => p.imovelId===imov.id && p.mes===cursor && p.pago);
    if (!pago) pendentes.push(cursor);
    const [y,m] = cursor.split('-').map(Number);
    cursor = m===12 ? `${y+1}-01` : `${y}-${String(m+1).padStart(2,'0')}`;
  }
  return pendentes;
}

function renderImoveis(el) {
  const list = DB.imoveis;
  if (!list.length) { el.innerHTML='<div class="empty"><div class="empty-icon">🏚</div>Nenhum imóvel cadastrado</div>'; return; }
  el.innerHTML = '<div class="card-list">'+list.map(i => {
    const pendentes = getPendentesImov(i);
    return `<div class="item-card" onclick="openImovDetail('${i.id}')">
      <div class="item-header">
        <div><div class="item-name">${i.inq}</div><div class="item-sub">${i.end}</div></div>
        <span class="badge ${pendentes.length>0?'badge-pendente':'badge-ativo'}">${pendentes.length>0?`${pendentes.length} pendente${pendentes.length>1?'s':''}`:'Em dia'}</span>
      </div>
      <div class="item-meta">
        <div class="meta-item">Aluguel<strong>${fmt(i.valor)}</strong></div>
        <div class="meta-item">Vencimento<strong>Dia ${i.dia}</strong></div>
        <div class="meta-item">Início<strong>${fmtDate(i.inicio)}</strong></div>
      </div>
    </div>`;
  }).join('')+'</div>';
}

function openImovDetail(id) {
  currentImovId = id;
  const imov = DB.imoveis.find(i => i.id===id);
  document.getElementById('imov-detail-name').textContent = imov.inq;
  document.getElementById('imov-detail-del-btn').onclick = () => excluirImov(id);
  renderImovDetail(); goTo('imov-detail');
}

function renderImovDetail() {
  const imov = DB.imoveis.find(i => i.id===currentImovId);
  if (!imov) return;
  const inicio = imov.inicio.slice(0,7), atual = today().slice(0,7);
  const nomesMeses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  let mesesList = []; let cursor = inicio;
  while (cursor <= atual) {
    const pag = DB.alugPags.find(p => p.imovelId===imov.id && p.mes===cursor && p.pago);
    mesesList.push({mes:cursor, pag});
    const [y,m] = cursor.split('-').map(Number);
    cursor = m===12 ? `${y+1}-01` : `${y}-${String(m+1).padStart(2,'0')}`;
  }
  const pendentes = mesesList.filter(x => !x.pag).reverse();
  const pagos = mesesList.filter(x => x.pag).reverse();
  const sorted = [...pendentes, ...pagos];
  const totalPago = pagos.reduce((s,x) => s+Number(x.pag.valor), 0);
  const totalPendente = pendentes.length * Number(imov.valor);
  document.getElementById('imov-detail-body').innerHTML = `
    <div class="stats-row">
      <div class="stat-card"><div class="stat-label">Aluguel mensal</div><div class="stat-val">${fmt(imov.valor)}</div></div>
      <div class="stat-card"><div class="stat-label">Meses pendentes</div><div class="stat-val" style="color:${pendentes.length>0?'var(--amber)':'var(--green)'}">${pendentes.length}</div></div>
      <div class="stat-card"><div class="stat-label">Total pendente</div><div class="stat-val" style="color:var(--red)">${fmt(totalPendente)}</div></div>
      <div class="stat-card"><div class="stat-label">Total recebido</div><div class="stat-val" style="color:var(--green)">${fmt(totalPago)}</div></div>
    </div>
    <div class="detail-section" style="margin-bottom:1.5rem">
      <div class="detail-row"><span>Inquilino</span><span>${imov.inq}</span></div>
      <div class="detail-row"><span>Endereço</span><span>${imov.end}</span></div>
      <div class="detail-row"><span>Vencimento</span><span>Dia ${imov.dia} de cada mês</span></div>
      <div class="detail-row"><span>Início do contrato</span><span>${fmtDate(imov.inicio)}</span></div>
    </div>
    <div class="section-title">Histórico de mensalidades</div>
    <div class="card-list">
      ${sorted.map(({mes,pag}) => {
        const [y,m] = mes.split('-');
        const label = `${nomesMeses[Number(m)-1]}${y}`;
        return `<div class="item-card no-click" style="padding:.85rem 1.25rem">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <div style="font-weight:500;font-size:14px">${label}</div>${pag?`<div class="hist-sub">Pago em ${fmtDate(pag.data)} · ${fmt(pag.valor)}</div>`:`<div class="hist-sub" style="color:var(--amber)">Aguardando pagamento</div>`}
            </div>
            <div style="display:flex;align-items:center;gap:10px">
              <span class="badge badge-${pag?'pago':'pendente'}">${pag?'Pago':'Pendente'}</span>${!pag?`<button class="btn btn-success" style="padding:5px 12px;font-size:12px" onclick="abrirAlugPag('${imov.id}','${mes}')">Dar baixa</button>`:`<button class="btn btn-danger" style="padding:5px 10px;font-size:12px" onclick="estornarAlugPag('${imov.id}','${mes}')">Estornar</button>`}
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

async function estornarAlugPag(imovelId, mes) {
  if (!confirm('Remover este pagamento?')) return;
  loading(true);
  try {
    const pag = DB.alugPags.find(p => p.imovelId===imovelId && p.mes===mes);
    if (pag) { await sbDelete('alug_pags', pag.id); DB.alugPags = DB.alugPags.filter(p => p.id!==pag.id); }
    renderImovDetail(); renderAlugStats();
  } catch(e) { alert('Erro: ' + e.message); }
  loading(false);
}

function renderPagMes(el) {
  const nomesMeses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const starts = DB.imoveis.map(i => i.inicio.slice(0,7));
  const earliest = starts.length ? starts.sort()[0] : today().slice(0,7);
  const atual = today().slice(0,7);
  let mesesOpts = []; let c = earliest;
  while (c <= atual) {
    mesesOpts.push(c);
    const [y,m] = c.split('-').map(Number);
    c = m===12 ? `${y+1}-01` : `${y}-${String(m+1).padStart(2,'0')}`;
  }
  mesesOpts.reverse();
  if (!alugMesFiltro || alugMesFiltro > atual) alugMesFiltro = atual;
  const mesF = alugMesFiltro.slice(0,7);
  const imoveis = DB.imoveis.filter(i => i.ativo!==false && i.inicio.slice(0,7)<=mesF);
  const pendentes = imoveis.filter(i => !DB.alugPags.find(p => p.imovelId===i.id && p.mes===mesF && p.pago));
  const pagos = imoveis.filter(i => DB.alugPags.find(p => p.imovelId===i.id && p.mes===mesF && p.pago));
  const sorted = [...pendentes, ...pagos];
  const totalRecebido = pagos.reduce((s,i) => { const p=DB.alugPags.find(p=>p.imovelId===i.id&&p.mes===mesF&&p.pago); return s+(p?Number(p.valor):0); }, 0);
  el.innerHTML = `
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:1rem;flex-wrap:wrap">
      <select onchange="alugMesFiltro=this.value;renderAlug()" style="padding:7px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;font-family:inherit;background:var(--surface);color:var(--text);cursor:pointer">
        ${mesesOpts.map(m => { const [y,mo]=m.split('-'); return `<option value="${m}" ${m===mesF?'selected':''}>${nomesMeses[Number(mo)-1]}${y}</option>`; }).join('')}
      </select>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <span class="badge badge-pendente">${pendentes.length} pendente${pendentes.length!==1?'s':''}</span>
        <span class="badge badge-pago">${pagos.length} pago${pagos.length!==1?'s':''}</span>
        ${pagos.length>0?`<span style="font-size:12px;color:var(--green-text);font-weight:500;padding:3px 6px">Total: ${fmt(totalRecebido)}</span>`:''}
      </div>
    </div>
    ${!imoveis.length?'<div class="empty"><div class="empty-icon">📅</div>Nenhum imóvel neste período</div>':
    '<div class="card-list">'+sorted.map(i => {
      const pag = DB.alugPags.find(p=>p.imovelId===i.id&&p.mes===mesF&&p.pago);
      return `<div class="item-card no-click">
        <div class="item-header">
          <div><div class="item-name">${i.inq}</div><div class="item-sub">${i.end} · Vence dia ${i.dia}</div></div>
          <span class="badge badge-${pag?'pago':'pendente'}">${pag?'Pago':'Pendente'}</span>
        </div>
        <div class="item-meta">
          <div class="meta-item">Valor<strong>${fmt(i.valor)}</strong></div>${pag?`<div class="meta-item">Pago em<strong>${fmtDate(pag.data)}</strong></div><div class="meta-item">Recebido<strong>${fmt(pag.valor)}</strong></div>`:''}
        </div>
        <div class="item-actions">
          ${!pag?`<button class="btn btn-success" onclick="abrirAlugPag('${i.id}','${mesF}')">✓ Confirmar pagamento</button>`:
          `<button class="btn btn-danger" onclick="estornarAlugPagMes('${i.id}','${mesF}')">↩ Estornar</button>`}
        </div>
      </div>`;
    }).join('')+'</div>'}`;
}

async function estornarAlugPagMes(imovelId, mes) {
  if (!confirm('Remover este pagamento?')) return;
  loading(true);
  try {
    const pag = DB.alugPags.find(p => p.imovelId===imovelId && p.mes===mes);
    if (pag) { await sbDelete('alug_pags', pag.id); DB.alugPags = DB.alugPags.filter(p => p.id!==pag.id); }
    renderAlugStats(); renderAlug();
  } catch(e) { alert('Erro: ' + e.message); }
  loading(false);
}

function renderHistAlug(el) {
  const sorted = DB.alugPags.filter(p=>p.pago).slice().sort((a,b)=>b.mes.localeCompare(a.mes));
  if (!sorted.length) { el.innerHTML='<div class="empty"><div class="empty-icon">📋</div>Nenhum pagamento registrado</div>'; return; }
  const byMes={};
  sorted.forEach(p => { if(!byMes[p.mes]) byMes[p.mes]=[]; byMes[p.mes].push(p); });
  const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  el.innerHTML='<div class="card-list">'+Object.entries(byMes).map(([mes,pags]) => {
    const [y,m]=mes.split('-'), total=pags.reduce((s,p)=>s+Number(p.valor),0);
    return `<div class="month-group">
      <div class="month-header"><span>${meses[Number(m)-1]} ${y}</span><span style="color:var(--green)">${fmt(total)}</span></div>
      <div class="item-card no-click" style="padding:0 1.25rem">
        ${pags.map(p => { const imov=DB.imoveis.find(i=>i.id===p.imovelId);
          return `<div class="hist-item"><div><div style="font-weight:500">${imov?imov.inq:'—'}</div><div class="hist-sub">${imov?imov.end:''} · pago em ${fmtDate(p.data)}</div></div><span class="tpos">${fmt(p.valor)}</span></div>`; }).join('')}
      </div>
    </div>`;
  }).join('')+'</div>';
}

async function salvarImov() {
  const end = document.getElementById('i-end').value.trim();
  const inq = document.getElementById('i-inq').value.trim();
  const valor = document.getElementById('i-valor').value;
  const dia = document.getElementById('i-dia').value;
  const inicio = document.getElementById('i-inicio').value;
  if (!end||!inq||!valor||!dia||!inicio) { alert('Preencha todos os campos obrigatórios.'); return; }
  loading(true);
  try {
    const rec = { id: uid(), endereco: end, inq, valor: Number(valor), dia: Number(dia), inicio, ativo: true };
    await sbInsert('imoveis', rec);
    DB.imoveis.push({...rec, end});
    closeModal('imov');
    ['i-end','i-inq','i-valor','i-dia'].forEach(x => document.getElementById(x).value='');
    renderAlugStats(); renderAlug();
  } catch(e) { alert('Erro ao salvar: ' + e.message); }
  loading(false);
}

async function excluirImov(id) {
  if (!confirm('Excluir este imóvel e todos os seus registros?')) return;
  loading(true);
  try {
    await sbDelete('imoveis', id);
    await sbDeleteWhere('alug_pags', 'imovel_id', id);
    DB.imoveis = DB.imoveis.filter(x => x.id!==id);
    DB.alugPags = DB.alugPags.filter(x => x.imovelId!==id);
    if (document.getElementById('p-imov-detail').classList.contains('active')) goTo('alugueis');
    else { renderAlugStats(); renderAlug(); }
  } catch(e) { alert('Erro: ' + e.message); }
  loading(false);
}

function preencherValorTotal() {
  const imov = DB.imoveis.find(i => i.id===currentAlugPagCtx.imovelId);
  if (imov) document.getElementById('ap-valor').value = imov.valor.toFixed(2);
}

function abrirAlugPag(imovelId, mes) {
  currentAlugPagCtx = { imovelId, mes };
  const imov = DB.imoveis.find(i => i.id===imovelId);
  const [y,m] = mes.split('-');
  const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  document.getElementById('ap-desc').textContent = `${imov.inq} — ${meses[Number(m)-1]} ${y} · Valor: ${fmt(imov.valor)}`;
  document.getElementById('ap-data').value = today();
  document.getElementById('ap-valor').value = imov.valor.toFixed(2);
  openModal('alug-pag');
}

async function confirmarAlugPag() {
  const data = document.getElementById('ap-data').value;
  const valor = document.getElementById('ap-valor').value;
  if (!data||!valor) { alert('Preencha todos os campos.'); return; }
  const {imovelId, mes} = currentAlugPagCtx;
  loading(true);
  try {
    const existing = DB.alugPags.find(p => p.imovelId===imovelId && p.mes===mes);
    if (existing) { await sbDelete('alug_pags', existing.id); DB.alugPags = DB.alugPags.filter(p => p.id!==existing.id); }
    const rec = { id: uid(), imovel_id: imovelId, mes, data_pag: data, valor: Number(valor), pago: true };
    await sbInsert('alug_pags', rec);
    DB.alugPags.push({...rec, imovelId, data});
    closeModal('alug-pag');
    renderAlugStats();
    if (document.getElementById('p-imov-detail').classList.contains('active')) renderImovDetail();
    else renderAlug();
  } catch(e) { alert('Erro: ' + e.message); }
  loading(false);
}

document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => { if (e.target===overlay) overlay.classList.add('hidden'); });
});

// Inicializar
(async () => {
  await loadAll();
  alugMesFiltro = today().slice(0,7);
  loading(false);
})();
</script>
